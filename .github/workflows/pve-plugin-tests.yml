name: PVE plugin tests

on:
  pull_request:
    paths:
      - 'pve-plugin/**'
      - '.github/workflows/pve-plugin-tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'pve-plugin/**'
      - '.github/workflows/pve-plugin-tests.yml'

jobs:
  plugin-unit:
    name: Unit tests (pure helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: prove
        run: prove pve-plugin/t/

  gui-tpl:
    name: GUI lint + template round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck pve-plugin/bin/pve-nonraid-gui
          shellcheck pve-plugin/t/tpl-roundtrip.sh
      - name: JS syntax
        run: node --check pve-plugin/js/pve-nonraid-storage.js
      - name: Template round-trip
        run: sh pve-plugin/t/tpl-roundtrip.sh

  plugin-load:
    name: Load through PVE::Storage (Debian 13 + PVE 9)
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4

      - name: Add Proxmox no-subscription repository
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends wget ca-certificates
          wget -q https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg \
            -O /usr/share/keyrings/proxmox-archive-keyring.gpg
          # Hash published in pve-docs (pve-package-repos.adoc).
          echo "136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45  /usr/share/keyrings/proxmox-archive-keyring.gpg" \
            | sha256sum -c -
          cat > /etc/apt/sources.list.d/proxmox.sources <<'EOF'
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
          EOF
          # Keep maintainer scripts from starting services in the container.
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libpve-storage-perl

      - name: Load the plugin through PVE::Storage
        # perl -c is a false negative for Custom/ plugins (compile cycle);
        # only loading through PVE::Storage proves anything.
        run: |
          install -D -m 0644 pve-plugin/PVE/Storage/Custom/NonRAIDPlugin.pm \
            /usr/share/perl5/PVE/Storage/Custom/NonRAIDPlugin.pm
          perl -e '
            use PVE::Storage;
            my $c = PVE::Storage::Plugin->lookup("nonraid");
            die "lookup failed\n" if !$c;
            my $v = $c->api();
            die "api $v out of range\n" if $v < 9 || $v > PVE::Storage::APIVER();
            die "properties missing\n" if !$c->properties()->{"nonraid-super"};
            print "loaded nonraid, api=$v\n";
          ' 2> stderr.log
          cat stderr.log
          if grep -q "Error loading storage plugin" stderr.log; then
            echo "plugin was skipped by the Custom/ scan" >&2
            exit 1
          fi

  package:
    name: Debian package build
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot lintian
          # Work on a copy: dh_install uses cp -a, which fails replaying
          # ACLs/xattrs onto some CI filesystems.
          mkdir -p /work
          tar --exclude=.git -cf - pve-plugin | tar -C /work -xf -
          cd /work/pve-plugin
          dpkg-buildpackage -b -us -uc
          lintian --fail-on error /work/libpve-storage-nonraid-perl_*.deb
          dpkg-deb -c /work/libpve-storage-nonraid-perl_*.deb
