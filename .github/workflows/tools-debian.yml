name: Build nonraid-tools Debian Package

# NOTE: GitHub Actions is DELIBERATELY DISABLED on this fork. This workflow is
# kept for parity (and in case Actions is ever enabled), but the ENFORCED
# version of these checks lives in checks/ and runs from .githooks/pre-push on
# every push. If you change a job here, change the matching checks/ script.

# Trimmed emulation of upstream's tools-debian.yml. Upstream's version is
# workflow_dispatch-only and also publishes to a PPA and cuts releases; a fork
# has neither the secrets nor the audience for that, so this keeps the half
# that matters here: proving the package BUILDS with a real version. Unlike
# upstream there is no synthesis step: the unit copies are committed under
# tools/debian/ and the changelog carries the real version, with debian/rules
# refusing a changelog that disagrees with nmdctl's VERSION=.

on:
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/tools-debian.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/**'
      - '.github/workflows/tools-debian.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build nonraid-tools .deb
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debhelper build-essential devscripts

      - name: Read the version
        # No synthesis any more: the unit copies are committed under
        # tools/debian/ and debian/rules refuses a changelog that disagrees
        # with nmdctl's VERSION=.
        run: |
          VERSION=$(grep '^VERSION=' tools/nmdctl | cut -d= -f2 | tr -d '"')
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd tools
          dpkg-buildpackage -b -us -uc
          ls -la ../*.deb

      - name: Sanity-check the package
        run: |
          deb=$(ls nonraid-tools_*.deb | head -1)
          dpkg-deb -I "$deb" | grep -q "Version: $VERSION-1"
          dpkg-deb -c "$deb" | grep -q './usr/bin/nmdctl'
          dpkg-deb -c "$deb" | grep -q 'nonraid.service'
          echo "package carries $VERSION-1 and its payload"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonraid-tools-${{ env.VERSION }}
          path: "*.deb"
          retention-days: 30
