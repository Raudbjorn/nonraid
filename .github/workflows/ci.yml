name: CI

# Trimmed from upstream's five workflows, but not to the point of proving
# nothing. Upstream's release/publishing jobs are gone (this fork ships no
# releases); the module build and an end-to-end array lifecycle are kept,
# because this fork stages driver and nmdctl changes and nothing else here
# would catch a kernel or parity regression.

on:
  pull_request:
  push:
    branches: [ main ]
  # Upstream runs its build and integration tests weekly too: the runner
  # kernel moves underneath the module, and a scheduled run catches that
  # drift without waiting for the next code change to trip over it.
  schedule:
    - cron: '0 3 * * 0'

jobs:
  nmdctl:
    runs-on: ubuntu-latest
    name: nmdctl lint + unit tests

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck bats util-linux jq

      - name: ShellCheck
        run: |
          shellcheck -x tools/nmdctl
          shellcheck packaging/docker/build-deb.sh
          shellcheck -x test/*.sh

      - name: Bash syntax
        run: bash -n tools/nmdctl

      - name: Unit tests
        run: |
          cd tools
          chmod +x nmdctl tests/*
          bats tests/

  dkms:
    name: DKMS build (${{ matrix.container.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container.image }}
    strategy:
      fail-fast: false
      matrix:
        container:
          - { name: "Debian 12",   image: "debian:12",   headers: "linux-headers-amd64" }
          - { name: "Debian 13",   image: "debian:13",   headers: "linux-headers-amd64" }
          - { name: "Ubuntu 24.04", image: "ubuntu:24.04", headers: "linux-headers-generic" }

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential dkms ${{ matrix.container.headers }}

      - name: Build the module against the installed headers
        run: |
          # The runner kernel has no headers in a container, so build against
          # whatever the headers package provides rather than $(uname -r).
          KVER=$(ls -1 /lib/modules | head -1)
          echo "Building for $KVER"
          make modules KVERSION="$KVER"

  package:
    name: Debian package
    runs-on: ubuntu-latest
    container: debian:13

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential debhelper dkms dh-dkms fakeroot

      - name: Build natively
        # Explicitly the native path: 'make package' would silently fall back to
        # a container if a build-dep went missing, and CI should fail loudly.
        run: make package-native

      - name: Assert packaging probes stay out of DKMS module builds
        run: |
          # The Makefile is installed into /usr/src and re-parsed on every DKMS
          # build. Packaging variables must stay behind the MAKECMDGOALS guard so
          # a module build never shells out to probe for docker.
          #
          # Run make separately and keep its stderr: piping straight into grep
          # takes the pipeline's status from grep, so a Makefile that fails to
          # parse emits no matching variables and the check "passes".
          set -o pipefail
          make -p -n modules > /tmp/make-db.txt || {
            echo "make -p -n modules failed; see the error above" >&2
            exit 1
          }
          # Every variable defined inside the MAKECMDGOALS guard, including the
          # host probes - moving any of them outside it must be caught.
          if grep -qE "^(DOCKER|DEB_IMAGE|DEB_BUILD_DEPS|DEB_BUILDER_IMAGE|IS_DEBIAN|HAVE_DH|HAVE_FAKEROOT|HAVE_BUILDDEPS|HAVE_DOCKER|IS_ROOTLESS|OUT_UID|OUT_GID|ENGINE_ADVICE|ENGINE_SWITCH) " /tmp/make-db.txt; then
            echo "packaging variables leaked into 'make modules'" >&2
            exit 1
          fi

  lifecycle:
    name: Array lifecycle (loop devices)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential dkms gdisk xfsprogs \
            linux-headers-$(uname -r)

      - name: Build and load the module
        run: |
          DKMS_VERSION=$(grep '^PACKAGE_VERSION=' dkms.conf | cut -d= -f2)
          sudo mkdir -p "/usr/src/nonraid-dkms-$DKMS_VERSION"
          sudo cp -r md_nonraid/ raid6/ dkms.conf Makefile "/usr/src/nonraid-dkms-$DKMS_VERSION/"
          sudo dkms install "nonraid-dkms/$DKMS_VERSION" -k "$(uname -r)"
          sudo modprobe nonraid6_pq
          sudo modprobe md-nonraid super=/nonraid.dat
          grep -q mdState /proc/nmdstat

      - name: Create, sync, write, fail a disk, rebuild, verify
        run: |
          set -e
          for i in 1 2 3 4; do
            truncate -s 1G "/tmp/d$i"
            L=$(sudo losetup -fP --show "/tmp/d$i")
            sudo sgdisk -o -a 8 -n 1:32K:0 "$L" >/dev/null
            sudo ln -sf "$L" "/dev/disk/by-id/citest-$i"
            eval "L$i=$L"
          done
          sudo udevadm settle
          N="sudo bash tools/nmdctl"
          # `check recon` returns as soon as the driver accepts the command, so
          # /proc/nmdstat can still say mdResync=0. Waiting only for idle matches
          # on the first poll and the run continues against an array that never
          # synced. Wait for it to start, then to finish, and fail on either
          # timeout rather than falling through to mount and md5sum.
          sync_wait() {
            for _ in $(seq 1 60); do grep -q "mdResync=0" /proc/nmdstat || break; sleep 1; done
            if grep -q "mdResync=0" /proc/nmdstat; then
              echo "resync never started within 60s"; cat /proc/nmdstat; exit 1
            fi
            for _ in $(seq 1 120); do grep -q "mdResync=0" /proc/nmdstat && break; sleep 2; done
            if ! grep -q "mdResync=0" /proc/nmdstat; then
              echo "resync still running after 240s"; cat /proc/nmdstat; exit 1
            fi
          }
          $N create --force "P:${L1}p1:citest-1" "1:${L2}p1:citest-2" "2:${L3}p1:citest-3"
          $N -u start new_array
          $N -u check recon
          sync_wait
          sudo mkfs.xfs -f /dev/nmd1p1 >/dev/null
          $N -u mount
          sudo dd if=/dev/urandom of=/mnt/disk1/t bs=1M count=64 status=none
          sudo sync
          BEFORE=$(sudo md5sum /mnt/disk1/t | cut -d' ' -f1)
          $N -u umount && $N -u stop
          $N unassign -f 1
          sudo dd if=/dev/zero of="${L2}p1" bs=1M status=none 2>/dev/null || true
          $N -u start disable_disk
          $N -u mount
          DEGRADED=$(sudo md5sum /mnt/disk1/t | cut -d' ' -f1)
          $N -u umount && $N -u stop
          $N -u import
          $N -u replace -f "1:${L2}p1:citest-2"
          $N -u start recon_disk
          $N -u check recon
          sync_wait
          $N -u mount
          AFTER=$(sudo md5sum /mnt/disk1/t | cut -d' ' -f1)
          echo "before=$BEFORE degraded=$DEGRADED after=$AFTER"
          [ "$BEFORE" = "$DEGRADED" ] && [ "$BEFORE" = "$AFTER" ]
